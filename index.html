<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Mentoria PRF | Plataforma de Estudos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #1f2d3d;
        }

        /* Container principal do curso (modo foco total) */
        .course-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Header do curso */
        .course-header {
            background: white;
            border-radius: 24px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
        }

        .back-home-btn {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-home-btn:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .course-title {
            font-size: 2rem;
            color: #1e6f5c;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .course-title i {
            font-size: 2.5rem;
            background: #1e6f5c;
            color: white;
            padding: 0.8rem;
            border-radius: 20px;
        }

        .progress-stats {
            background: #f0fdf4;
            padding: 1rem;
            border-radius: 16px;
            margin-top: 1rem;
        }

        .progress-bar-container {
            height: 12px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin: 0.5rem 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1e6f5c, #289b81);
            width: 0%;
            transition: width 0.5s;
        }

        .user-info-mini {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #2c3e50;
        }

        /* Filtros */
        .filters-container {
            background: white;
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            background: #f0f0f0;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: #1e6f5c;
            color: white;
        }

        .filter-btn:hover:not(.active) {
            background: #e0e0e0;
        }

        /* Lista de conteúdos */
        .contents-list {
            background: white;
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .content-item {
            padding: 1.2rem;
            border-bottom: 1px solid #eef2f8;
            transition: all 0.2s;
        }

        .content-item:last-child {
            border-bottom: none;
        }

        .content-item:hover {
            background: #fafbfc;
            transform: translateX(5px);
        }

        .content-item.completed {
            background: #f0fdf4;
            border-left: 4px solid #1e6f5c;
        }

        .content-header {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }

        .content-checkbox {
            width: 22px;
            height: 22px;
            margin-top: 2px;
            cursor: pointer;
            accent-color: #1e6f5c;
        }

        .content-text {
            flex: 1;
            line-height: 1.5;
            font-size: 1rem;
        }

        .content-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-link {
            background: #3498db;
            color: white;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn-link:hover {
            background: #2980b9;
            transform: translateY(-1px);
        }

        .btn-remove {
            background: #e74c3c;
        }

        .btn-remove:hover {
            background: #c0392b;
        }

        .link-container {
            margin-top: 0.8rem;
            padding-left: 2.5rem;
        }

        .link-container a {
            color: #1e6f5c;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .link-container a:hover {
            text-decoration: underline;
        }

        .link-input {
            width: 100%;
            max-width: 500px;
            padding: 0.6rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            margin-top: 0.5rem;
            font-size: 0.9rem;
        }

        .link-input:focus {
            outline: none;
            border-color: #1e6f5c;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #6c757d;
        }

        /* Login overlay */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .login-card {
            background: white;
            border-radius: 32px;
            padding: 2.5rem;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .login-card h2 {
            color: #1e6f5c;
            margin-bottom: 0.5rem;
        }

        .login-card input {
            width: 100%;
            padding: 0.8rem;
            margin: 0.5rem 0;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
        }

        .login-card button {
            width: 100%;
            padding: 0.8rem;
            margin-top: 1rem;
            background: #1e6f5c;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
        }

        .login-card button:hover {
            background: #0f5243;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        /* Selection screen */
        .selection-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .disciplines-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .discipline-card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .discipline-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .discipline-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .discipline-card h3 {
            color: #1e6f5c;
            margin-bottom: 0.5rem;
        }

        .discipline-progress {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 0.5rem;
        }

        .progress-mini-bar {
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin-top: 0.8rem;
            overflow: hidden;
        }

        .progress-mini-fill {
            height: 100%;
            background: #1e6f5c;
            width: 0%;
        }

        .logout-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 100;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .user-name {
            font-weight: 600;
            color: #1e6f5c;
        }

        @media (max-width: 768px) {
            .course-container {
                padding: 1rem;
            }
            .course-title {
                font-size: 1.5rem;
                flex-direction: column;
                text-align: center;
            }
            .content-header {
                flex-direction: column;
            }
            .content-actions {
                margin-top: 0.5rem;
                margin-left: 2rem;
            }
            .back-home-btn {
                position: static;
                margin-bottom: 1rem;
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<!-- Tela de Seleção de Disciplina -->
<div id="selectionScreen" class="selection-screen">
    <div style="width: 100%; text-align: center;">
        <h1 style="color: white; margin-bottom: 2rem; font-size: 2.5rem;">
            <i class="fas fa-gavel"></i> Mentoria PRF
        </h1>
        <div class="disciplines-grid" id="disciplinesGrid"></div>
        <button id="logoutFromSelection" class="logout-btn" style="position: fixed; bottom: 2rem; right: 2rem;">
            <i class="fas fa-sign-out-alt"></i> Sair
        </button>
    </div>
</div>

<!-- Container do Curso (mostrado após selecionar disciplina) -->
<div id="courseContainer" class="course-container" style="display: none;">
    <div class="course-header">
        <button id="backToSelectionBtn" class="back-home-btn">
            <i class="fas fa-arrow-left"></i> Voltar para disciplinas
        </button>
        <div class="course-title">
            <i class="fas fa-book-open"></i>
            <span id="courseTitle"></span>
        </div>
        <div class="header-info">
            <span class="user-name" id="courseUserName"></span>
            <span id="courseProgressText">0% concluído</span>
        </div>
        <div class="progress-stats">
            <div class="progress-bar-container">
                <div class="progress-fill" id="courseProgressFill"></div>
            </div>
        </div>
    </div>

    <div class="filters-container">
        <button class="filter-btn active" data-filter="all">Todos os tópicos</button>
        <button class="filter-btn" data-filter="pending">Pendentes</button>
        <button class="filter-btn" data-filter="completed">Concluídos</button>
    </div>

    <div class="contents-list" id="contentsList"></div>
</div>

<!-- Login Overlay -->
<div id="loginOverlay" class="login-overlay" style="display: none;">
    <div class="login-card">
        <i class="fas fa-gavel" style="font-size: 3rem; color: #1e6f5c; margin-bottom: 1rem;"></i>
        <h2>Bem-vindo à Mentoria PRF</h2>
        <p style="color: #6c757d; margin-bottom: 1.5rem;">Faça login para acessar seu curso</p>
        <input type="email" id="loginEmail" placeholder="Seu email">
        <input type="password" id="loginPassword" placeholder="Sua senha">
        <button id="loginBtn">Entrar</button>
        <button id="registerBtn" style="background: #6c757d; margin-top: 0.5rem;">Criar nova conta</button>
        <div id="loginError" class="error-msg"></div>
    </div>
</div>

<script>
    // ==================== DADOS DAS DISCIPLINAS ====================
    const disciplinesData = {
        portugues: { 
            name: "LÍNGUA PORTUGUESA", 
            icon: "fas fa-language",
            contents: [
                "1. Compreensão e interpretação de textos de gêneros variados.",
                "2. Reconhecimento de tipos e gêneros textuais.",
                "3. Domínio da ortografia oficial.",
                "4. Domínio dos mecanismos de coesão textual: emprego de elementos de referenciação, substituição e repetição, de conectores e outros elementos de sequenciação textual; emprego de tempos e modos verbais.",
                "5. Domínio da estrutura morfossintática do período: emprego das classes de palavras; relações de coordenação e subordinação; emprego dos sinais de pontuação; concordância verbal e nominal; regência verbal e nominal; crase; colocação pronominal.",
                "6. Reescrita de frases e parágrafos: significação das palavras; substituição de palavras ou trechos; reorganização da estrutura de orações e períodos."
            ]
        },
        raciocinio: { 
            name: "RACIOCÍNIO LÓGICO-MATEMÁTICO", 
            icon: "fas fa-chart-line",
            contents: [
                "1. Estruturas lógicas.",
                "2. Lógica de argumentação: analogias, inferências, deduções e conclusões.",
                "3. Lógica sentencial (proposicional): proposições simples e compostas; tabelas-verdade; equivalências; leis de Morgan; diagramas lógicos.",
                "4. Lógica de primeira ordem.",
                "5. Princípios de contagem e probabilidade.",
                "6. Operações com conjuntos.",
                "7. Raciocínio lógico envolvendo problemas aritméticos, geométricos e matriciais.",
                "8. Estatística e probabilidade básicas: medidas de tendência central, dispersão, amostragem."
            ]
        },
        constitucional: { 
            name: "DIREITO CONSTITUCIONAL", 
            icon: "fas fa-balance-scale",
            contents: [
                "1. Princípios fundamentais da CF/88.",
                "2. Direitos e garantias fundamentais: individuais, coletivos, sociais, nacionalidade, direitos políticos.",
                "3. Organização do Estado: União, estados, municípios, DF.",
                "4. Administração Pública: disposições gerais, servidores públicos.",
                "5. Poder Legislativo, Executivo e Judiciário.",
                "6. Funções essenciais à justiça.",
                "7. Controle de constitucionalidade."
            ]
        },
        penal: { 
            name: "DIREITO PENAL", 
            icon: "fas fa-gavel",
            contents: [
                "1. Princípios básicos do direito penal.",
                "2. Aplicação da lei penal no tempo: tempo do crime, conflito de leis.",
                "3. Aplicação da lei penal no espaço: territorialidade, extraterritorialidade.",
                "4. Tipicidade: crime doloso e culposo.",
                "5. Erro de tipo.",
                "6. Crime consumado e tentado.",
                "7. Crime impossível.",
                "8. Punibilidade e causas de extinção.",
                "9. Ilicitude: causas de exclusão, excesso punível.",
                "10. Culpabilidade: causas de exclusão, imputabilidade, erro de proibição.",
                "11. Crimes contra a pessoa.",
                "12. Crimes contra o patrimônio.",
                "13. Crimes contra a dignidade sexual.",
                "14. Crimes contra a incolumidade pública.",
                "15. Crimes contra a fé pública.",
                "16. Crimes contra a Administração Pública."
            ]
        },
        inteligencia: { 
            name: "LEGISLAÇÃO DE TRÂNSITO", 
            icon: "fas fa-car",
            contents: [
                "1. CTB - Lei 9.503/97: objetivos, conceitos, definições.",
                "2. Sistema Nacional de Trânsito: competências e atribuições.",
                "3. Normas gerais de circulação e conduta.",
                "4. Sinalização de trânsito.",
                "5. Infrações: tipificação, penalidades, medidas administrativas.",
                "6. Processo administrativo de imposição de penalidades.",
                "7. Crimes de trânsito (arts. 302 a 312-A).",
                "8. Direção defensiva e primeiros socorros.",
                "9. Resolução CONTRAN 04/1998", "10. Resolução 14/1998", "11. Resolução 24/1998", "12. Resolução 36/1998",
                "13. Resolução 92/1999", "14. Resolução 110/2000", "15. Resolução 160/2004", "16. Resolução 210/2006",
                "17. Resolução 211/2006", "18. Resolução 216/2006", "19. Resolução 227/2007", "20. Resolução 253/2007",
                "21. Resolução 254/2007", "22. Resolução 290/2008", "23. Resolução 349/2010", "24. Resolução 360/2010",
                "25. Resolução 432/2013", "26. Resolução 441/2013", "27. Resolução 471/2013", "28. Resolução 508/2014",
                "29. Resolução 520/2015", "30. Resolução 525/2015", "31. Resolução 552/2015", "32. Resolução 561/2015",
                "33. Resolução 667/2017", "34. Resolução 735/2018", "35. Resolução 740/2018", "36. Resolução 780/2019",
                "37. Resolução 789/2020 - Anexo I", "38. Resolução 798/2020", "39. Resolução 803/2020", "40. Resolução 806/2020",
                "41. Resolução 809/2020", "42. Resolução 810/2020"
            ]
        }
    };

    // Estado da aplicação
    let currentUser = null;
    let currentDiscipline = null;
    let progressData = {};
    let linkData = {};
    let currentFilter = "all";

    // ==================== FUNÇÕES DE USUÁRIO ====================
    function getUsers() { return JSON.parse(localStorage.getItem('mentoria_users') || '{}'); }
    function saveUsers(users) { localStorage.setItem('mentoria_users', JSON.stringify(users)); }
    
    function login(email, password) {
        const users = getUsers();
        if (users[email] && users[email].password === password) {
            currentUser = email;
            localStorage.setItem('mentoria_current_user', email);
            loadUserData();
            document.getElementById('loginOverlay').style.display = 'none';
            showSelectionScreen();
            return true;
        }
        document.getElementById('loginError').textContent = "Email ou senha inválidos!";
        return false;
    }
    
    function register(email, password) {
        if (!email || !password) {
            document.getElementById('loginError').textContent = "Preencha email e senha!";
            return false;
        }
        const users = getUsers();
        if (users[email]) {
            document.getElementById('loginError').textContent = "Email já cadastrado!";
            return false;
        }
        users[email] = { password, createdAt: new Date().toISOString() };
        saveUsers(users);
        document.getElementById('loginError').textContent = "Conta criada! Faça login.";
        return true;
    }
    
    function logout() {
        currentUser = null;
        currentDiscipline = null;
        localStorage.removeItem('mentoria_current_user');
        progressData = {};
        linkData = {};
        document.getElementById('courseContainer').style.display = 'none';
        document.getElementById('selectionScreen').style.display = 'none';
        document.getElementById('loginOverlay').style.display = 'flex';
    }
    
    function loadUserData() {
        const savedProgress = localStorage.getItem(`mentoria_progress_${currentUser}`);
        progressData = savedProgress ? JSON.parse(savedProgress) : {};
        const savedLinks = localStorage.getItem(`mentoria_links_${currentUser}`);
        linkData = savedLinks ? JSON.parse(savedLinks) : {};
    }
    
    function saveProgress() {
        if (currentUser) {
            localStorage.setItem(`mentoria_progress_${currentUser}`, JSON.stringify(progressData));
            localStorage.setItem(`mentoria_links_${currentUser}`, JSON.stringify(linkData));
        }
    }
    
    // ==================== FUNÇÕES DE PROGRESSO ====================
    function getDisciplineProgress(disciplineId) {
        const contents = disciplinesData[disciplineId]?.contents || [];
        let completed = 0;
        for (let i = 0; i < contents.length; i++) {
            if (progressData[disciplineId]?.[i]) completed++;
        }
        return { completed, total: contents.length, percent: contents.length ? (completed/contents.length)*100 : 0 };
    }
    
    function toggleContent(index) {
        if (!currentDiscipline) return;
        if (!progressData[currentDiscipline]) progressData[currentDiscipline] = {};
        progressData[currentDiscipline][index] = !progressData[currentDiscipline][index];
        saveProgress();
        renderContents();
        updateCourseProgress();
        updateDisciplinesGrid(); // Atualiza a grade na tela de seleção
    }
    
    function saveLink(index, url) {
        if (!currentDiscipline) return;
        const key = `${currentDiscipline}_${index}`;
        if (url) linkData[key] = url;
        else delete linkData[key];
        saveProgress();
        renderContents();
    }
    
    // ==================== RENDERIZAÇÃO ====================
    function showSelectionScreen() {
        document.getElementById('selectionScreen').style.display = 'flex';
        document.getElementById('courseContainer').style.display = 'none';
        currentDiscipline = null;
        updateDisciplinesGrid();
    }
    
    function showCourse(disciplineId) {
        currentDiscipline = disciplineId;
        currentFilter = "all";
        document.getElementById('selectionScreen').style.display = 'none';
        document.getElementById('courseContainer').style.display = 'block';
        
        const discipline = disciplinesData[disciplineId];
        document.getElementById('courseTitle').textContent = discipline.name;
        document.getElementById('courseUserName').innerHTML = `<i class="fas fa-user-circle"></i> ${currentUser.split('@')[0]}`;
        
        updateCourseProgress();
        renderContents();
        
        // Resetar filtros ativos
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.dataset.filter === 'all') btn.classList.add('active');
        });
    }
    
    function updateCourseProgress() {
        if (!currentDiscipline) return;
        const progress = getDisciplineProgress(currentDiscipline);
        document.getElementById('courseProgressFill').style.width = `${progress.percent}%`;
        document.getElementById('courseProgressText').textContent = `${Math.round(progress.percent)}% concluído (${progress.completed}/${progress.total} tópicos)`;
    }
    
    function updateDisciplinesGrid() {
        const grid = document.getElementById('disciplinesGrid');
        if (!grid) return;
        grid.innerHTML = '';
        Object.entries(disciplinesData).forEach(([id, data]) => {
            const prog = getDisciplineProgress(id);
            const card = document.createElement('div');
            card.className = 'discipline-card';
            card.innerHTML = `
                <div class="discipline-icon"><i class="${data.icon}"></i></div>
                <h3>${data.name}</h3>
                <div class="discipline-progress">${prog.completed}/${prog.total} tópicos concluídos</div>
                <div class="progress-mini-bar"><div class="progress-mini-fill" style="width: ${prog.percent}%;"></div></div>
                <button class="filter-btn" style="margin-top: 1rem; background: #1e6f5c; color: white; width: 100%;">Iniciar curso →</button>
            `;
            card.querySelector('button').onclick = (e) => {
                e.stopPropagation();
                showCourse(id);
            };
            grid.appendChild(card);
        });
    }
    
    function renderContents() {
        if (!currentDiscipline) return;
        const data = disciplinesData[currentDiscipline];
        const contents = data.contents;
        let html = '';
        
        contents.forEach((text, idx) => {
            const isCompleted = progressData[currentDiscipline]?.[idx] || false;
            const shouldShow = currentFilter === 'all' || 
                              (currentFilter === 'completed' && isCompleted) || 
                              (currentFilter === 'pending' && !isCompleted);
            if (!shouldShow) return;
            
            const linkKey = `${currentDiscipline}_${idx}`;
            const hasLink = linkData[linkKey];
            
            html += `
                <div class="content-item ${isCompleted ? 'completed' : ''}">
                    <div class="content-header">
                        <input type="checkbox" class="content-checkbox" ${isCompleted ? 'checked' : ''} onchange="toggleContent(${idx})">
                        <div class="content-text"><strong>Tópico ${idx+1}</strong><br>${text}</div>
                        <div class="content-actions">
                            <button class="btn-link" onclick="showLinkInput(${idx})"><i class="fas fa-link"></i> ${hasLink ? 'Editar link' : 'Adicionar link'}</button>
                        </div>
                    </div>
                    <div id="linkContainer_${idx}" class="link-container">
                        ${hasLink ? `<a href="${linkData[linkKey]}" target="_blank"><i class="fas fa-external-link-alt"></i> Material de apoio</a> <button class="btn-link btn-remove" onclick="removeLinkAndRefresh(${idx})">Remover</button>` : ''}
                    </div>
                </div>
            `;
        });
        
        if (html === '') {
            html = '<div class="empty-state"><i class="fas fa-check-circle" style="font-size: 3rem; color: #1e6f5c;"></i><h3>Nenhum conteúdo encontrado</h3><p>Tente outro filtro</p></div>';
        }
        
        document.getElementById('contentsList').innerHTML = html;
    }
    
    // Funções globais para onclick
    window.toggleContent = toggleContent;
    window.showLinkInput = function(index) {
        const container = document.getElementById(`linkContainer_${index}`);
        const currentLink = linkData[`${currentDiscipline}_${index}`] || '';
        container.innerHTML = `
            <input type="url" id="linkInput_${index}" class="link-input" placeholder="https://..." value="${currentLink}">
            <div style="margin-top: 0.5rem;">
                <button class="btn-link" onclick="saveLinkAndRefresh(${index})">Salvar</button>
                <button class="btn-link" onclick="cancelLink(${index})">Cancelar</button>
            </div>
        `;
    };
    
    window.saveLinkAndRefresh = function(index) {
        const input = document.getElementById(`linkInput_${index}`);
        if (input) saveLink(index, input.value);
    };
    
    window.removeLinkAndRefresh = function(index) {
        saveLink(index, null);
    };
    
    window.cancelLink = function(index) {
        renderContents();
    };
    
    // ==================== EVENT LISTENERS ====================
    function setupEventListeners() {
        document.getElementById('backToSelectionBtn').addEventListener('click', showSelectionScreen);
        document.getElementById('logoutFromSelection').addEventListener('click', logout);
        
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderContents();
            });
        });
        
        document.getElementById('loginBtn').addEventListener('click', () => {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            login(email, password);
        });
        
        document.getElementById('registerBtn').addEventListener('click', () => {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            register(email, password);
        });
    }
    
    // ==================== INICIALIZAÇÃO ====================
    function init() {
        setupEventListeners();
        
        const savedUser = localStorage.getItem('mentoria_current_user');
        if (savedUser) {
            const users = getUsers();
            if (users[savedUser]) {
                currentUser = savedUser;
                loadUserData();
                showSelectionScreen();
                document.getElementById('loginOverlay').style.display = 'none';
                return;
            }
        }
        
        document.getElementById('loginOverlay').style.display = 'flex';
        document.getElementById('selectionScreen').style.display = 'none';
        document.getElementById('courseContainer').style.display = 'none';
    }
    
    init();
</script>
</body>
</html>
