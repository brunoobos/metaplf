<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentoria PRF | Plataforma de Estudos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f4f8;
            color: #1f2d3d;
        }

        /* Login */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .login-card {
            background: white;
            border-radius: 32px;
            padding: 2.5rem;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .login-card .logo-icon {
            font-size: 3rem;
            color: #0056a7;
            margin-bottom: 1rem;
        }

        .login-card h2 {
            color: #0056a7;
            margin-bottom: 0.5rem;
        }

        .login-card input {
            width: 100%;
            padding: 0.8rem;
            margin: 0.5rem 0;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
        }

        .login-card button {
            width: 100%;
            padding: 0.8rem;
            margin-top: 0.5rem;
            background: #0056a7;
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
        }

        .login-card .register-btn {
            background: #eef2f6;
            color: #0056a7;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }

        /* Header */
        .main-header {
            background: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid #e2e8f0;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            cursor: pointer;
        }

        .logo-icon {
            background: #0056a7;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: white;
        }

        .logo-text h1 {
            font-size: 1.3rem;
            color: #0056a7;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: #f0f4f8;
            padding: 0.5rem 1rem;
            border-radius: 40px;
        }

        .role-badge {
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .role-admin {
            background: #e74c3c;
            color: white;
        }

        .role-student {
            background: #27ae60;
            color: white;
        }

        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            cursor: pointer;
        }

        /* Hero */
        .hero {
            background: linear-gradient(135deg, #e8f0fe, #ffffff);
            padding: 3rem 2rem;
            text-align: center;
        }

        .hero h1 {
            font-size: 2rem;
            color: #0056a7;
        }

        /* Admin Panel */
        .admin-panel {
            background: white;
            margin: 2rem;
            padding: 1.5rem;
            border-radius: 24px;
            display: none;
        }

        .admin-stats {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
        }

        .stat-card {
            background: #e8f0fe;
            padding: 1rem;
            border-radius: 16px;
            text-align: center;
            min-width: 150px;
        }

        /* Disciplinas Grid */
        .section-title {
            text-align: center;
            margin: 2rem 0 1rem;
            font-size: 1.5rem;
        }

        .disciplines-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto 2rem;
            padding: 0 2rem;
        }

        .discipline-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid #eef2f8;
        }

        .discipline-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .discipline-icon {
            font-size: 2.5rem;
            color: #0056a7;
            margin-bottom: 1rem;
        }

        .progress-bar {
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            margin: 0.8rem 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #0056a7;
            width: 0%;
        }

        /* Course Container */
        .course-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        .course-header {
            background: white;
            border-radius: 24px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .back-btn {
            background: #eef2f6;
            color: #0056a7;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            cursor: pointer;
            margin-bottom: 1rem;
        }

        .course-title {
            font-size: 1.5rem;
            color: #0056a7;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 1rem 0;
        }

        .filters {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .filter-btn {
            background: #f0f4f8;
            border: none;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            cursor: pointer;
        }

        .filter-btn.active {
            background: #0056a7;
            color: white;
        }

        .contents-list {
            background: white;
            border-radius: 24px;
            padding: 1rem;
        }

        .content-item {
            padding: 1rem;
            border-bottom: 1px solid #eef2f8;
        }

        .content-item.completed {
            background: #f0fdf4;
            border-left: 4px solid #0056a7;
        }

        .content-header {
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
        }

        .content-checkbox {
            width: 20px;
            height: 20px;
            margin-top: 2px;
            cursor: pointer;
        }

        .content-text {
            flex: 1;
        }

        .link-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .link-container {
            margin-top: 0.5rem;
            padding-left: 2rem;
        }

        .link-container a {
            color: #0056a7;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1001;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 1.5rem;
            max-width: 450px;
            width: 90%;
        }

        .modal-content input, .modal-content textarea {
            width: 100%;
            padding: 0.7rem;
            margin: 0.5rem 0;
            border: 1px solid #ddd;
            border-radius: 12px;
        }

        .modal-buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .modal-buttons button {
            flex: 1;
            padding: 0.5rem;
            border-radius: 40px;
            cursor: pointer;
            border: none;
        }

        .footer {
            background: #1a2a3a;
            color: white;
            text-align: center;
            padding: 1.5rem;
            margin-top: 2rem;
        }

        @media (max-width: 768px) {
            .main-header {
                flex-direction: column;
                gap: 1rem;
            }
            .disciplines-grid {
                padding: 0 1rem;
            }
            .course-container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="loginScreen" class="login-overlay">
    <div class="login-card">
        <div class="logo-icon"><i class="fas fa-gavel"></i></div>
        <h2>Mentoria PRF</h2>
        <p>Prepare-se para a Polícia Rodoviária Federal</p>
        <input type="email" id="emailInput" placeholder="Email">
        <input type="password" id="passwordInput" placeholder="Senha">
        <button id="doLoginBtn">Entrar</button>
        <button id="doRegisterBtn" class="register-btn">Criar nova conta</button>
        <div id="loginMsg" class="error-msg"></div>
        <div style="margin-top: 1rem; font-size: 0.7rem; color: #666;">
            Admin: admin@mentoria.com / admin123
        </div>
    </div>
</div>

<!-- TELA PRINCIPAL -->
<div id="homeScreen" style="display: none;">
    <header class="main-header">
        <div class="logo-area" id="goHomeBtn">
            <div class="logo-icon"><i class="fas fa-gavel"></i></div>
            <div class="logo-text">
                <h1>Mentoria PRF</h1>
            </div>
        </div>
        <div class="user-info">
            <i class="fas fa-user-circle"></i>
            <span id="userNameDisplay"></span>
            <span id="roleDisplay" class="role-badge"></span>
            <button id="logoutMainBtn" class="logout-btn">Sair</button>
        </div>
    </header>

    <section class="hero">
        <h1>Prepare-se para a PRF</h1>
        <p>Conteúdo atualizado conforme o edital 2021</p>
    </section>

    <!-- Painel Admin -->
    <div id="adminPanel" class="admin-panel">
        <h3 style="color:#0056a7;"><i class="fas fa-shield-alt"></i> Painel do Administrador</h3>
        <div class="admin-stats">
            <div class="stat-card">
                <i class="fas fa-link" style="font-size: 1.5rem;"></i>
                <h3 id="totalLinks">0</h3>
                <p>Links</p>
            </div>
            <div class="stat-card">
                <i class="fas fa-users" style="font-size: 1.5rem;"></i>
                <h3 id="totalStudents">0</h3>
                <p>Alunos</p>
            </div>
        </div>
    </div>

    <h2 class="section-title">Disciplinas</h2>
    <div id="disciplinesGrid" class="disciplines-grid"></div>

    <footer class="footer">
        <p>Mentoria PRF - Plataforma de estudos</p>
    </footer>
</div>

<!-- TELA DO CURSO -->
<div id="courseScreen" style="display: none;">
    <div class="course-container">
        <div class="course-header">
            <button id="backToHomeBtn" class="back-btn"><i class="fas fa-arrow-left"></i> Voltar</button>
            <div class="course-title">
                <i id="courseIcon" class="fas fa-book"></i>
                <span id="courseTitle"></span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 0.5rem;">
                <span><i class="fas fa-user"></i> <span id="courseUserName"></span> <span id="courseRoleBadge" class="role-badge"></span></span>
                <span id="courseProgressPercent">0%</span>
            </div>
            <div class="progress-bar" style="margin-top: 0.5rem;">
                <div id="courseProgressFill" class="progress-fill" style="width: 0%;"></div>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Todos</button>
            <button class="filter-btn" data-filter="pending">Pendentes</button>
            <button class="filter-btn" data-filter="completed">Concluídos</button>
        </div>

        <div id="contentsContainer" class="contents-list"></div>

        <button id="logoutCourseBtn" class="logout-btn" style="position: fixed; bottom: 1rem; right: 1rem;">Sair</button>
    </div>
</div>

<!-- MODAL DE LINK -->
<div id="linkModal" class="modal">
    <div class="modal-content">
        <h3 style="color:#0056a7;"><i class="fas fa-link"></i> Gerenciar Link</h3>
        <input type="url" id="modalUrl" placeholder="URL do material">
        <textarea id="modalDesc" rows="2" placeholder="Descrição (opcional)"></textarea>
        <div class="modal-buttons">
            <button id="modalSaveBtn" style="background:#0056a7; color:white;">Salvar</button>
            <button id="modalDeleteBtn" style="background:#e74c3c; color:white; display:none;">Excluir</button>
            <button id="modalCancelBtn" style="background:#eef2f6;">Cancelar</button>
        </div>
    </div>
</div>

<script>
    // ==================== DADOS ====================
    const DISCIPLINAS = {
        portugues: { nome: "LÍNGUA PORTUGUESA", icone: "fas fa-language",
            conteudos: ["Compreensão e interpretação de textos", "Tipos e gêneros textuais", "Ortografia oficial", "Coesão textual", "Estrutura morfossintática", "Reescrita de frases"] },
        raciocinio: { nome: "RACIOCÍNIO LÓGICO", icone: "fas fa-chart-line",
            conteudos: ["Estruturas lógicas", "Lógica de argumentação", "Lógica sentencial", "Lógica de primeira ordem", "Princípios de contagem", "Operações com conjuntos"] },
        constitucional: { nome: "DIREITO CONSTITUCIONAL", icone: "fas fa-balance-scale",
            conteudos: ["Princípios fundamentais", "Direitos e garantias", "Organização do Estado", "Administração Pública", "Poder Legislativo", "Poder Judiciário"] },
        penal: { nome: "DIREITO PENAL", icone: "fas fa-gavel",
            conteudos: ["Princípios básicos", "Aplicação da lei penal", "Tipicidade", "Ilicitude", "Culpabilidade", "Crimes contra a pessoa", "Crimes contra o patrimônio"] },
        transito: { nome: "LEGISLAÇÃO DE TRÂNSITO", icone: "fas fa-car",
            conteudos: ["CTB - conceitos", "Sistema Nacional de Trânsito", "Normas de circulação", "Sinalização", "Infrações e penalidades", "Crimes de trânsito", "Resolução 04/1998", "Resolução 14/1998", "Resolução 24/1998"] }
    };

    // ==================== ESTADO GLOBAL ====================
    let usuarioAtual = null;
    let tipoUsuario = null;
    let disciplinaAtual = null;
    let filtroAtual = "all";
    let progresso = {};
    let linksGlobais = {};

    // ==================== FUNÇÕES DE USUÁRIO ====================
    function obterUsuarios() {
        const dados = localStorage.getItem('usuarios_prf');
        if (dados) return JSON.parse(dados);
        const admin = { "admin@mentoria.com": { senha: "admin123", tipo: "admin", nome: "Administrador" } };
        localStorage.setItem('usuarios_prf', JSON.stringify(admin));
        return admin;
    }

    function salvarUsuarios(usuarios) {
        localStorage.setItem('usuarios_prf', JSON.stringify(usuarios));
    }

    function login(email, senha) {
        const usuarios = obterUsuarios();
        if (usuarios[email] && usuarios[email].senha === senha) {
            usuarioAtual = email;
            tipoUsuario = usuarios[email].tipo;
            localStorage.setItem('usuario_prf_atual', email);
            localStorage.setItem('tipo_prf_atual', tipoUsuario);
            carregarDados();
            mostrarTelaHome();
            return true;
        }
        document.getElementById('loginMsg').innerText = "Email ou senha inválidos!";
        return false;
    }

    function registrar(email, senha) {
        if (!email || !senha) {
            document.getElementById('loginMsg').innerText = "Preencha todos os campos!";
            return false;
        }
        const usuarios = obterUsuarios();
        if (usuarios[email]) {
            document.getElementById('loginMsg').innerText = "Email já cadastrado!";
            return false;
        }
        usuarios[email] = { senha: senha, tipo: "aluno", nome: email.split('@')[0] };
        salvarUsuarios(usuarios);
        document.getElementById('loginMsg').innerText = "Conta criada! Faça login.";
        return true;
    }

    function logout() {
        usuarioAtual = null;
        tipoUsuario = null;
        disciplinaAtual = null;
        localStorage.removeItem('usuario_prf_atual');
        localStorage.removeItem('tipo_prf_atual');
        document.getElementById('homeScreen').style.display = 'none';
        document.getElementById('courseScreen').style.display = 'none';
        document.getElementById('loginScreen').style.display = 'flex';
    }

    function carregarDados() {
        // Progresso
        const progSalvo = localStorage.getItem(`progresso_${usuarioAtual}`);
        progresso = progSalvo ? JSON.parse(progSalvo) : {};
        
        // Links globais
        const linksSalvos = localStorage.getItem('links_globais_prf');
        if (linksSalvos) {
            linksGlobais = JSON.parse(linksSalvos);
        } else {
            linksGlobais = {
                "penal_0": { url: "https://www.planalto.gov.br/ccivil_03/decreto-lei/del2848compilado.htm", desc: "Código Penal" },
                "transito_0": { url: "https://www.planalto.gov.br/ccivil_03/leis/l9503.htm", desc: "Código de Trânsito" },
                "constitucional_0": { url: "https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm", desc: "Constituição Federal" }
            };
            localStorage.setItem('links_globais_prf', JSON.stringify(linksGlobais));
        }
    }

    function salvarProgresso() {
        localStorage.setItem(`progresso_${usuarioAtual}`, JSON.stringify(progresso));
    }

    function salvarLinksGlobais() {
        localStorage.setItem('links_globais_prf', JSON.stringify(linksGlobais));
        if (disciplinaAtual) renderizarConteudos();
        if (tipoUsuario === 'admin') atualizarStatsAdmin();
    }

    // ==================== PROGRESSO ====================
    function obterProgresso(disciplinaId) {
        const conteudos = DISCIPLINAS[disciplinaId]?.conteudos || [];
        let concluidos = 0;
        for (let i = 0; i < conteudos.length; i++) {
            if (progresso[disciplinaId]?.[i]) concluidos++;
        }
        const total = conteudos.length;
        return { concluidos, total, percentual: total ? (concluidos / total) * 100 : 0 };
    }

    function alternarConteudo(disciplinaId, indice) {
        if (!progresso[disciplinaId]) progresso[disciplinaId] = {};
        progresso[disciplinaId][indice] = !progresso[disciplinaId][indice];
        salvarProgresso();
        
        if (disciplinaAtual === disciplinaId) {
            atualizarProgressoCurso();
            renderizarConteudos();
        }
        renderizarGradeDisciplinas();
    }

    // ==================== LINKS ====================
    let linkEditando = null;

    function abrirModalLink(disciplinaId, indice) {
        if (tipoUsuario !== 'admin') return;
        
        linkEditando = { disciplinaId, indice };
        const chave = `${disciplinaId}_${indice}`;
        const link = linksGlobais[chave];
        
        document.getElementById('modalUrl').value = link?.url || '';
        document.getElementById('modalDesc').value = link?.desc || '';
        
        if (link) {
            document.getElementById('modalDeleteBtn').style.display = 'block';
        } else {
            document.getElementById('modalDeleteBtn').style.display = 'none';
        }
        
        document.getElementById('linkModal').style.display = 'flex';
    }

    function salvarLink() {
        if (!linkEditando) return;
        const { disciplinaId, indice } = linkEditando;
        const chave = `${disciplinaId}_${indice}`;
        const url = document.getElementById('modalUrl').value;
        const desc = document.getElementById('modalDesc').value;
        
        if (url) {
            linksGlobais[chave] = { url, desc };
        } else {
            delete linksGlobais[chave];
        }
        
        salvarLinksGlobais();
        fecharModal();
    }

    function excluirLink() {
        if (!linkEditando) return;
        const { disciplinaId, indice } = linkEditando;
        const chave = `${disciplinaId}_${indice}`;
        delete linksGlobais[chave];
        salvarLinksGlobais();
        fecharModal();
    }

    function fecharModal() {
        document.getElementById('linkModal').style.display = 'none';
        linkEditando = null;
    }

    // ==================== ADMIN ====================
    function atualizarStatsAdmin() {
        if (tipoUsuario !== 'admin') return;
        const totalLinks = Object.keys(linksGlobais).length;
        document.getElementById('totalLinks').innerText = totalLinks;
        
        const usuarios = obterUsuarios();
        const totalAlunos = Object.keys(usuarios).filter(email => usuarios[email].tipo === 'aluno').length;
        document.getElementById('totalStudents').innerText = totalAlunos;
    }

    // ==================== RENDERIZAÇÃO ====================
    function mostrarTelaHome() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('homeScreen').style.display = 'block';
        document.getElementById('courseScreen').style.display = 'none';
        disciplinaAtual = null;
        
        const usuarios = obterUsuarios();
        const dados = usuarios[usuarioAtual];
        document.getElementById('userNameDisplay').innerText = dados.nome;
        
        const roleSpan = document.getElementById('roleDisplay');
        if (tipoUsuario === 'admin') {
            roleSpan.innerText = 'Administrador';
            roleSpan.className = 'role-badge role-admin';
            document.getElementById('adminPanel').style.display = 'block';
            atualizarStatsAdmin();
        } else {
            roleSpan.innerText = 'Aluno';
            roleSpan.className = 'role-badge role-student';
            document.getElementById('adminPanel').style.display = 'none';
        }
        
        renderizarGradeDisciplinas();
    }

    function renderizarGradeDisciplinas() {
        const grid = document.getElementById('disciplinesGrid');
        grid.innerHTML = '';
        
        for (const [id, dados] of Object.entries(DISCIPLINAS)) {
            const prog = obterProgresso(id);
            const card = document.createElement('div');
            card.className = 'discipline-card';
            card.innerHTML = `
                <div class="discipline-icon"><i class="${dados.icone}"></i></div>
                <h3>${dados.nome}</h3>
                <div class="progress-bar"><div class="progress-fill" style="width: ${prog.percentual}%;"></div></div>
                <div style="font-size: 0.8rem;">${prog.concluidos}/${prog.total} tópicos</div>
                <button class="filter-btn" style="margin-top: 1rem; background: #0056a7; color: white;">Acessar</button>
            `;
            card.querySelector('button').onclick = () => abrirCurso(id);
            grid.appendChild(card);
        }
    }

    function abrirCurso(disciplinaId) {
        disciplinaAtual = disciplinaId;
        filtroAtual = "all";
        document.getElementById('homeScreen').style.display = 'none';
        document.getElementById('courseScreen').style.display = 'block';
        
        const dados = DISCIPLINAS[disciplinaId];
        document.getElementById('courseTitle').innerText = dados.nome;
        document.getElementById('courseIcon').className = dados.icone;
        
        const usuarios = obterUsuarios();
        document.getElementById('courseUserName').innerText = usuarios[usuarioAtual].nome;
        
        const roleSpanCurso = document.getElementById('courseRoleBadge');
        if (tipoUsuario === 'admin') {
            roleSpanCurso.innerText = 'Administrador';
            roleSpanCurso.className = 'role-badge role-admin';
        } else {
            roleSpanCurso.innerText = 'Aluno';
            roleSpanCurso.className = 'role-badge role-student';
        }
        
        atualizarProgressoCurso();
        renderizarConteudos();
        
        // Reset filtros
        document.querySelectorAll('#courseScreen .filter-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.dataset.filter === 'all') btn.classList.add('active');
        });
    }

    function atualizarProgressoCurso() {
        const prog = obterProgresso(disciplinaAtual);
        document.getElementById('courseProgressFill').style.width = `${prog.percentual}%`;
        document.getElementById('courseProgressPercent').innerText = `${Math.round(prog.percentual)}%`;
    }

    function renderizarConteudos() {
        const dados = DISCIPLINAS[disciplinaAtual];
        const container = document.getElementById('contentsContainer');
        let html = '';
        
        dados.conteudos.forEach((texto, idx) => {
            const concluido = progresso[disciplinaAtual]?.[idx] || false;
            const exibir = filtroAtual === 'all' || 
                          (filtroAtual === 'completed' && concluido) || 
                          (filtroAtual === 'pending' && !concluido);
            if (!exibir) return;
            
            const chaveLink = `${disciplinaAtual}_${idx}`;
            const link = linksGlobais[chaveLink];
            const isAdmin = tipoUsuario === 'admin';
            
            html += `
                <div class="content-item ${concluido ? 'completed' : ''}">
                    <div class="content-header">
                        <input type="checkbox" class="content-checkbox" ${concluido ? 'checked' : ''} 
                               onclick="alternarConteudo('${disciplinaAtual}', ${idx})">
                        <div class="content-text"><strong>Tópico ${idx+1}</strong><br>${texto}</div>
                        ${isAdmin ? `
                        <button class="link-btn" onclick="abrirModalLink('${disciplinaAtual}', ${idx})">
                            <i class="fas fa-edit"></i> ${link ? 'Editar' : 'Adicionar'} link
                        </button>
                        ` : ''}
                    </div>
                    ${link ? `
                    <div class="link-container">
                        <a href="${link.url}" target="_blank"><i class="fas fa-external-link-alt"></i> 📚 ${link.desc || 'Material de apoio'}</a>
                    </div>
                    ` : (isAdmin ? '<div class="link-container" style="color:#999;">ℹ️ Nenhum link adicionado</div>' : '')}
                </div>
            `;
        });
        
        if (!html) html = '<div style="text-align:center;padding:2rem;">Nenhum conteúdo encontrado</div>';
        container.innerHTML = html;
    }

    // ==================== EVENTOS ====================
    function configurarEventos() {
        // Login
        document.getElementById('doLoginBtn').onclick = () => {
            login(document.getElementById('emailInput').value, document.getElementById('passwordInput').value);
        };
        document.getElementById('doRegisterBtn').onclick = () => {
            registrar(document.getElementById('emailInput').value, document.getElementById('passwordInput').value);
        };
        
        // Home
        document.getElementById('logoutMainBtn').onclick = logout;
        document.getElementById('logoutCourseBtn').onclick = logout;
        document.getElementById('backToHomeBtn').onclick = () => mostrarTelaHome();
        document.getElementById('goHomeBtn').onclick = () => mostrarTelaHome();
        
        // Modal
        document.getElementById('modalSaveBtn').onclick = salvarLink;
        document.getElementById('modalDeleteBtn').onclick = excluirLink;
        document.getElementById('modalCancelBtn').onclick = fecharModal;
        
        // Filtros
        document.querySelectorAll('#courseScreen .filter-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('#courseScreen .filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                filtroAtual = btn.dataset.filter;
                renderizarConteudos();
            };
        });
        
        // Fechar modal ao clicar fora
        window.onclick = (e) => {
            if (e.target === document.getElementById('linkModal')) fecharModal();
        };
    }

    // ==================== INICIALIZAÇÃO ====================
    function init() {
        configurarEventos();
        
        const usuarioSalvo = localStorage.getItem('usuario_prf_atual');
        const tipoSalvo = localStorage.getItem('tipo_prf_atual');
        
        if (usuarioSalvo && tipoSalvo) {
            usuarioAtual = usuarioSalvo;
            tipoUsuario = tipoSalvo;
            carregarDados();
            mostrarTelaHome();
        } else {
            document.getElementById('loginScreen').style.display = 'flex';
        }
    }
    
    // Tornar funções globais para onclick
    window.alternarConteudo = alternarConteudo;
    window.abrirModalLink = abrirModalLink;
    
    init();
</script>
</body>
</html>
